name: Sync Fork with Upstreams

on:
  schedule:
    - cron: '0 0 * * *' # 每天 UTC 0 点（北京时间早 8 点）自动运行
  workflow_dispatch: # 允许在网页上手动点击运行

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Sync with momo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream-momo https://github.com/feiniji/momo.float.phone.git
          git fetch upstream-momo
          # 尝试合并，如果冲突则不会覆盖你的代码，直接报错退出
          git merge upstream-momo/main --no-edit || { echo "❌ momo 合并冲突，已安全中止，请手动解决"; exit 1; }

      - name: Sync with doremy
        run: |
          git remote add upstream-doremy https://github.com/feiniji/doremy.float.phone.git
          git fetch upstream-doremy
          git merge upstream-doremy/main --no-edit || { echo "❌ doremy 合并冲突，已安全中止，请手动解决"; exit 1; }

      - name: Push changes
        run: git push origin main
